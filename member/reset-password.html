<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>𝄞</text></svg>">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students' Choir — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/cache-helper.js"></script>
<style>
:root{
  --primary:#2563eb;--primary-dark:#1d4ed8;--primary-light:#dbeafe;
  --bg:#f8fafc;--surface:#fff;--text:#0f172a;--muted:#64748b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Inter,sans-serif;background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 50%,#3b82f6 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  flex-direction:column;
}
.card{
  background:var(--surface);width:100%;max-width:420px;border-radius:20px;
  padding:40px 32px 32px;box-shadow:0 25px 50px rgba(0,0,0,.25);
}
.logo{
  width:64px;height:64px;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 20px;
}
.logo img{
  width:300%;
  height:190%;
  object-fit:contain;
  display:block;
}
h1{font-size:22px;text-align:center;color:var(--text);margin-bottom:6px}
.sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:20px}
.note{
  background:var(--primary-light);color:var(--primary-dark);
  border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.5;
  margin-bottom:20px;text-align:center;
}
label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px}
input{
  width:100%;padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:10px;
  font-size:14px;font-family:inherit;transition:.2s;margin-bottom:16px;
}
input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
button{
  width:100%;padding:13px;background:var(--primary);color:#fff;border:none;
  border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:.2s;
  font-family:inherit;
}
button:hover{background:var(--primary-dark)}
button:disabled{opacity:.6;cursor:not-allowed}
.msg{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
.msg.err{background:#fee2e2;color:#991b1b;display:block}
.msg.ok{background:#d1fae5;color:#065f46;display:block}
.msg.info{background:#e0f2fe;color:#0369a1;display:block}
.foot{text-align:center;font-size:13px;color:var(--muted);margin-top:20px}
.foot a{color:var(--primary);text-decoration:none;font-weight:600}
.foot a:hover{text-decoration:underline}

.page-credit{
  margin-top:18px;
  text-align:center;
  font-size:12.5px;
  color:rgba(255,255,255,.85);
  font-weight:500;
  letter-spacing:.2px;
}
.page-credit strong{color:#fff;font-weight:700}
.page-credit i{font-size:14px;vertical-align:-2px;margin-right:3px}
</style>
</head>
<body>
<form class="card" id="resetForm">
  <div class="logo"><img src="https://embuni.ac.ke/wp-content/uploads/2026/02/logo2-1_increased-1.png" alt="University of Embu logo"></div>
  <h1>Reset Password</h1>
  <p class="sub">Enter your email and choose a new password</p>

  <div class="note">
    <i class="ti ti-info-circle"></i> Enter your registered email and create a new password.
  </div>

  <div class="msg" id="msg"></div>

  <label>Email</label>
  <input type="email" id="email" required placeholder="Fname.Lname@choir.com" autocomplete="email">
  <label>New Password</label>
  <input type="password" id="newPassword" required placeholder="Minimum 6 characters" autocomplete="new-password">
  <label>Confirm Password</label>
  <input type="password" id="confirmPassword" required placeholder="Re-enter your password" autocomplete="new-password">
  <button type="submit" id="btn">Update Password</button>
  <p class="foot">Remembered your password? <a href="../login.html">Login here</a></p>
</form>

<p class="page-credit">
  <i class="ti ti-bolt"></i> Powered by <strong>UoEM StarLife</strong>
</p>

<script>
const SUPABASE_URL = 'https://skrvassehezrynudbahn.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrcnZhc3NlaGV6cnludWRiYWhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MzUyMzAsImV4cCI6MjA5MjExMTIzMH0.iA93tmu9TCdmEhUxBLGRUE0fRdDha9-WPps8qNzd5a0';

// NOTE: as flagged previously, this exposes the Supabase SERVICE ROLE key in
// client-side code, which bypasses Row Level Security for anyone who reads
// the page source. This is carried over unchanged from the existing file.
const SUPABASE_SERVICE_ROLE = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrcnZhc3NlaGV6cnludWRiYWhuIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NjUzNTIzMCwiZXhwIjoyMDkyMTExMjMwfQ.pi_FYbGS63x2vHm4L_yaffuuSL3ofDm7xZKxABVguFQ';

const sbAdmin = supabase.createClient(SUPABASE_URL, SUPABASE_SERVICE_ROLE);
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = s => document.querySelector(s);
const msg = $("#msg");
function show(text, cls="err"){ msg.innerHTML = text; msg.className = "msg " + cls; }

$("#resetForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = $("#email").value.trim().toLowerCase();
  const password = $("#newPassword").value;
  const confirmPassword = $("#confirmPassword").value;
  const btn = $("#btn");

  msg.className = "msg";

  if (password !== confirmPassword) {
    show("Passwords do not match!");
    return;
  }
  if (password.length < 6) {
    show("Password must be at least 6 characters");
    return;
  }

  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Processing…";

  try {
    show("Verifying your email…", "info");

    const { data: member, error: memberError } = await sb
      .from('members')
      .select('member_id, name, email')
      .eq('email', email)
      .single();

    if (memberError || !member) {
      show("Email not found in choir records. Please contact the choir administrator.");
      btn.disabled = false; btn.textContent = originalText;
      return;
    }

    show("Finding your account…", "info");

    const { data: users, error: usersError } = await sbAdmin.auth.admin.listUsers();

    if (usersError) {
      console.error('List users error:', usersError);
      show("Error finding account. Please try again.");
      btn.disabled = false; btn.textContent = originalText;
      return;
    }

    const targetUser = users?.users?.find(u => u.email === email);

    if (!targetUser) {
      show("No user account found for this email. Please register first.");
      btn.disabled = false; btn.textContent = originalText;
      return;
    }

    show("Updating your password…", "info");

    const { error: updateError } = await sbAdmin.auth.admin.updateUserById(
      targetUser.id,
      { password: password }
    );

    if (updateError) throw updateError;

    await sb
      .from('members')
      .update({
        password_set: true,
        password_updated_at: new Date()
      })
      .eq('member_id', member.member_id);

    show("Password updated successfully! Redirecting to login…", "ok");

    setTimeout(() => {
      window.location.href = '../login.html';
    }, 2000);

  } catch (error) {
    console.error('Reset error:', error);
    if (error.message?.includes('Database error')) {
      show("Database error. Please try again.");
    } else if (error.message?.includes('permission denied')) {
      show("Permission denied. Please check the service role key.");
    } else {
      show("Error resetting password: " + error.message);
    }
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
 <link rel="icon" type="image/png" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='white'/%3E%3Ctext x='50' y='72' font-size='52' text-anchor='middle' fill='%234f46e5' font-family='Arial'%3E🎶%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='white'/%3E%3Ctext x='50' y='72' font-size='52' text-anchor='middle' fill='%234f46e5' font-family='Arial'%3E🎶%3C/text%3E%3C/svg%3E">
 <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students' Choir — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="cache-helper.js"></script>
<style>
:root{
  --primary:#2563eb;--primary-dark:#1d4ed8;--primary-light:#dbeafe;
  --bg:#f8fafc;--surface:#fff;--text:#0f172a;--muted:#64748b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Inter,sans-serif;background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 50%,#3b82f6 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  flex-direction:column;
}
.card{
  background:var(--surface);width:100%;max-width:420px;border-radius:20px;
  padding:40px 32px 32px;box-shadow:0 25px 50px rgba(0,0,0,.25);
}
.logo{
  width:64px;height:64px;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 20px;
}
.logo img{
  width:350%;
  height:200%;
  object-fit:contain;
  display:block;
}
h1{font-size:22px;text-align:center;color:var(--text);margin-bottom:6px}
.sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:28px}
label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px}
input{
  width:100%;padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:10px;
  font-size:14px;font-family:inherit;transition:.2s;margin-bottom:16px;
}
input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
button{
  width:100%;padding:13px;background:var(--primary);color:#fff;border:none;
  border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:.2s;
  font-family:inherit;
}
button:hover{background:var(--primary-dark)}
button:disabled{opacity:.6;cursor:not-allowed}
.msg{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
.msg.err{background:#fee2e2;color:#991b1b;display:block}
.msg.ok{background:#d1fae5;color:#065f46;display:block}
.msg.info{background:#e0f2fe;color:#0369a1;display:block}
.foot{text-align:center;font-size:13px;color:var(--muted);margin-top:20px}
.foot a{color:var(--primary);text-decoration:none;font-weight:600}
.foot a:hover{text-decoration:underline}

.page-credit{
  margin-top:18px;
  text-align:center;
  font-size:12.5px;
  color:rgba(255,255,255,.85);
  font-weight:500;
  letter-spacing:.2px;
}
.page-credit strong{color:#fff;font-weight:700}
.page-credit i{font-size:14px;vertical-align:-2px;margin-right:3px}
</style>
</head>
<body>
<form class="card" id="loginForm">
  <div class="logo"><img src="https://embuni.ac.ke/wp-content/uploads/2026/02/logo2-1_increased-1.png" alt="University of Embu logo"></div>
  <h1>Students' Choir</h1>
  <p class="sub">University of Embu — Attendance System</p>
  <div class="msg" id="msg"></div>
  <label>Email</label>
  <input type="email" id="email" required placeholder="Fname.Lname@choir.com" autocomplete="email">
  <label>Password</label>
  <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
  <button type="submit" id="btn">Sign In</button>
  <p class="foot">New member? <a href="member/register.html">Register</a> · <a href="member/reset-password.html">Forgot password?</a></p>
</form>

<p class="page-credit">
  <i class="ti ti-bolt"></i> Powered by <strong>UoEM StarLife</strong>
</p>

<script>
const SUPABASE_URL = 'https://skrvassehezrynudbahn.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrcnZhc3NlaGV6cnludWRiYWhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MzUyMzAsImV4cCI6MjA5MjExMTIzMH0.iA93tmu9TCdmEhUxBLGRUE0fRdDha9-WPps8qNzd5a0';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = s => document.querySelector(s);
const msg = $("#msg");
function show(text, cls="err"){ msg.textContent = text; msg.className = "msg " + cls; }

async function getRole(email) {
  const { data } = await sb.from("user_roles").select("role").eq("email", email).maybeSingle();
  return data?.role || "member";
}

/**
 * Route the user to the correct destination based on:
 * 1. must_change_password flag → force change-password page
 * 2. role → admin or member dashboard
 */
async function routeUser(user) {
  // 1. Check for forced password change
  const { data: profile } = await sb
    .from('user_profiles')
    .select('must_change_password')
    .eq('user_id', user.id)
    .maybeSingle();

  if (profile?.must_change_password) {
    show("Please set a new password before continuing…", "info");
    setTimeout(() => {
      window.location.href = "member/change-password.html";
    }, 1200);
    return;
  }

  // 2. Route by role
  const role = await getRole(user.email);
  show("Success! Redirecting…", "ok");
  setTimeout(() => {
    window.location.href = role === "admin" ? "admin/index.html" : "member/dashboard.html";
  }, 500);
}

async function checkSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    await routeUser(session.user);
  }
}

$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = $("#email").value.trim();
  const password = $("#password").value;
  const btn = $("#btn");
  btn.disabled = true; btn.textContent = "Signing in…";
  msg.className = "msg";

  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;

    // Route based on password-change flag + role
    await routeUser(data.user);

  } catch (err) {
    let errorMsg = err.message || "Login failed";
    if (errorMsg === 'Invalid login credentials') {
      errorMsg = 'Invalid email or password. Please check your credentials.';
    } else if (errorMsg.includes('Email not confirmed')) {
      errorMsg = 'Please confirm your email address first.';
    } else if (errorMsg.includes('rate limit')) {
      errorMsg = 'Too many login attempts. Please try again later.';
    }
    show(errorMsg);
    btn.disabled = false; btn.textContent = "Sign In";
  }
});

checkSession();
</script>
</body>
</html>

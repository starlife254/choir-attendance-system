<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset | University of Embu Choir</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 28px;
            padding: 40px 32px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35);
        }
        .icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 22px;
            color: #1e293b;
            margin-bottom: 12px;
        }
        p {
            color: #64748b;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 16px;
        }
        .contact-box {
            background: #eef2ff;
            border: 1px solid #c7d2fe;
            border-radius: 14px;
            padding: 20px;
            margin: 24px 0;
            text-align: left;
        }
        .contact-box h3 {
            font-size: 14px;
            color: #4f46e5;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .contact-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            color: #1e293b;
            padding: 8px 0;
            text-decoration: none;
        }
        .contact-row:hover { color: #4f46e5; }
        .contact-row i {
            width: 24px;
            text-align: center;
            font-size: 18px;
            color: #4f46e5;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            padding: 12px 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
        }
        .back-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(102,126,234,0.35);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🔑</div>
        <h1>Forgot Your Password?</h1>
        <p>For security reasons, password resets are handled by the choir administration.</p>

        <div class="contact-box">
            <h3>
                <span>📞</span> Contact the Choir Secretary
            </h3>
           
        </div>

        <p style="font-size: 13px; color: #94a3b8;">
            Once you contact them, your password will be reset to a temporary one. You'll be asked to create a new personal password when you log in.
        </p>

        <a href="../login.html" class="back-btn">
            <span>←</span> Back to Login
        </a>
    </div>
</body>
</html>

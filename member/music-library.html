<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='white'/%3E%3Ctext x='50' y='72' font-size='52' text-anchor='middle' fill='%234f46e5' font-family='Arial'%3E🎶%3C/text%3E%3C/svg%3E">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Music Library | University of Embu Choir</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/cache-helper.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --primary: #5b4fcf;
            --primary-dark: #3d35a8;
            --primary-light: #ede9ff;
            --gold: #d4af37;
            --green: #10b981;
            --amber: #f59e0b;
            --red: #ef4444;
            --slate-900: #0f172a;
            --slate-700: #334155;
            --slate-500: #64748b;
            --slate-300: #cbd5e1;
            --slate-100: #f1f5f9;
            --slate-50: #f8fafc;
            --white: #ffffff;
            --border: #e2e8f0;
            --bg: #f8fafc;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f0eef9;
            background-image: radial-gradient(ellipse at 20% 10%, rgba(91, 79, 207, 0.10) 0%, transparent 60%),
                              radial-gradient(ellipse at 80% 90%, rgba(124, 58, 237, 0.08) 0%, transparent 50%);
            min-height: 100vh;
            padding: 16px;
            color: var(--slate-900);
            line-height: 1.5;
        }
        .container { max-width: 1024px; margin: 0 auto; background: var(--white); border-radius: 32px; padding: 24px 24px 32px; box-shadow: 0 32px 64px -16px rgba(91, 79, 207, 0.18), 0 0 0 1px rgba(91, 79, 207, 0.05); margin-bottom: 80px; animation: fadeSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }
        @keyframes fadeSlide { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; margin-bottom: 22px; }
        .header h1 { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.4px; display: flex; align-items: center; gap: 10px; }
        .header h1 i { color: var(--primary); }
        .header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .btn-outline { background: transparent; border: 1.5px solid var(--slate-300); padding: 8px 18px; border-radius: 40px; font-weight: 600; font-size: 13px; font-family: inherit; color: var(--slate-700); cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
        .btn-outline:hover { background: var(--slate-50); border-color: var(--primary); color: var(--primary); }

        /* HERO */
        .hero { background: linear-gradient(135deg, var(--primary) 0%, #7c3aed 100%); color: white; padding: 24px 28px; border-radius: 24px; margin-bottom: 24px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; box-shadow: 0 8px 28px rgba(91, 79, 207, 0.3); position: relative; overflow: hidden; }
        .hero::before { content: ''; position: absolute; top: -40px; right: -40px; width: 180px; height: 180px; background: rgba(255,255,255,0.08); border-radius: 50%; }
        .hero-icon { width: 68px; height: 68px; border-radius: 20px; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center; font-size: 32px; flex-shrink: 0; }
        .hero-text { flex: 1; min-width: 200px; position: relative; z-index: 1; }
        .hero-text h2 { font-size: 22px; font-weight: 800; margin-bottom: 4px; letter-spacing: -0.3px; }
        .hero-text p { font-size: 13px; opacity: 0.9; }

        /* SEARCH & FILTERS */
        .toolbar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .search-wrap { position: relative; flex: 1; min-width: 220px; }
        .search-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--slate-500); font-size: 14px; }
        .search-input { width: 100%; padding: 11px 14px 11px 40px; border: 1.5px solid var(--slate-300); border-radius: 40px; font-size: 13px; font-family: inherit; background: white; outline: none; transition: border .15s, box-shadow .15s; }
        .search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(91,79,207,0.1); }
        .filter-select { padding: 11px 16px; border: 1.5px solid var(--slate-300); border-radius: 40px; font-size: 13px; font-family: inherit; background: white; color: var(--slate-700); cursor: pointer; outline: none; transition: border .15s; }
        .filter-select:focus { border-color: var(--primary); }

        /* STATS BAR */
        .stats-bar { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; padding: 14px 18px; background: var(--slate-50); border-radius: 16px; }
        .stat-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--slate-700); font-weight: 500; }
        .stat-item i { font-size: 15px; color: var(--primary); }
        .stat-item strong { color: var(--slate-900); font-weight: 700; }

        /* SORT TABS */
        .sort-tabs { display: flex; gap: 6px; margin-bottom: 18px; overflow-x: auto; padding-bottom: 4px; }
        .sort-tab { padding: 8px 16px; border-radius: 40px; border: 1.5px solid var(--slate-300); background: white; font-size: 12px; font-weight: 600; color: var(--slate-700); cursor: pointer; white-space: nowrap; font-family: inherit; transition: all .15s; }
        .sort-tab:hover { border-color: var(--primary); color: var(--primary); }
        .sort-tab.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 12px rgba(91,79,207,0.25); }

        /* GRID */
        .scores-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }

        .score-card { background: white; border: 1px solid var(--border); border-radius: 18px; overflow: hidden; transition: all .25s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; position: relative; }
        .score-card:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(91,79,207,0.13), 0 0 0 1px rgba(91,79,207,0.1); border-color: var(--primary-light); }

        .score-thumb { width: 100%; height: 170px; background: linear-gradient(135deg, #e0e7ff, #c7d2fe); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .score-thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; transition: transform .5s; }
        .score-card:hover .score-thumb img { transform: scale(1.05); }
        .score-thumb .placeholder { font-size: 52px; color: var(--primary); opacity: 0.35; }

        .new-badge { position: absolute; top: 10px; left: 10px; background: linear-gradient(135deg, #06b6d4, #0891b2); color: white; padding: 3px 10px; border-radius: 40px; font-size: 10px; font-weight: 700; letter-spacing: 0.4px; z-index: 2; box-shadow: 0 3px 10px rgba(6,182,212,0.4); }
        .pdf-badge { position: absolute; top: 10px; right: 10px; background: rgba(220,38,38,0.95); color: white; padding: 3px 9px; border-radius: 40px; font-size: 10px; font-weight: 700; letter-spacing: 0.4px; z-index: 2; display: flex; align-items: center; gap: 3px; }

        .score-body { padding: 14px 16px 10px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
        .score-title { font-size: 14px; font-weight: 700; color: var(--slate-900); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .score-composer { font-size: 11.5px; color: var(--slate-500); display: flex; align-items: center; gap: 4px; }
        .score-chips { display: flex; gap: 4px; flex-wrap: wrap; }
        .chip { display: inline-flex; align-items: center; gap: 3px; padding: 2px 9px; border-radius: 40px; font-size: 10px; font-weight: 600; }
        .chip-primary { background: var(--primary-light); color: var(--primary); }
        .chip-gray { background: var(--slate-100); color: var(--slate-500); }
        .chip-amber { background: #fef3c7; color: #92400e; }

        .score-meta { display: flex; align-items: center; justify-content: space-between; font-size: 10.5px; color: var(--slate-500); padding-top: 8px; border-top: 1px dashed var(--slate-100); margin-top: auto; }
        .score-meta span { display: flex; align-items: center; gap: 3px; }

        .score-actions { padding: 10px 14px 14px; display: flex; gap: 6px; }
        .download-btn { flex: 1; padding: 9px; border: none; border-radius: 12px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; font-weight: 700; font-size: 12.5px; font-family: inherit; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: transform .12s, box-shadow .15s; box-shadow: 0 3px 10px rgba(91,79,207,0.25); }
        .download-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(91,79,207,0.35); }
        .download-btn:active { transform: translateY(0); }

        /* EMPTY */
        .empty-state { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--slate-500); }
        .empty-state i { font-size: 56px; color: var(--slate-300); display: block; margin-bottom: 14px; }
        .empty-state h3 { font-size: 18px; font-weight: 700; color: var(--slate-900); margin-bottom: 6px; }
        .empty-state p { font-size: 13px; }

        /* BOTTOM NAV */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(12px); display: flex; justify-content: space-around; padding: 8px 12px 12px; box-shadow: 0 -1px 0 rgba(91, 79, 207, 0.08), 0 -8px 24px rgba(91, 79, 207, 0.06); z-index: 100; }
        .bottom-nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--slate-500); font-size: 10px; font-weight: 600; gap: 2px; padding: 6px 10px; border-radius: 12px; cursor: pointer; background: none; border: none; font-family: inherit; transition: all 0.18s; }
        .bottom-nav-item i { font-size: 20px; }
        .bottom-nav-item.active { color: var(--primary); background: var(--primary-light); }
        @media (min-width: 768px) { .bottom-nav { display: none; } .container { margin-bottom: 0; } }

        /* TOAST */
        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(10px); background: var(--slate-900); color: white; padding: 12px 22px; border-radius: 40px; font-size: 13px; font-weight: 500; z-index: 300; opacity: 0; transition: opacity .22s, transform .22s; pointer-events: none; display: flex; align-items: center; gap: 8px; max-width: 90vw; box-shadow: 0 8px 24px rgba(0,0,0,0.18); }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { background: #065f46; }
        .toast.error { background: #991b1b; }
        .toast.info { background: var(--primary); }

        @media (max-width: 640px) {
            body { padding: 10px; }
            .container { padding: 16px; border-radius: 24px; }
            .hero { padding: 18px 20px; }
            .hero-text h2 { font-size: 18px; }
            .hero-icon { width: 56px; height: 56px; font-size: 26px; }
            .scores-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .score-thumb { height: 150px; }
            .header h1 { font-size: 1.2rem; }
            .toolbar { flex-direction: column; }
        }
        @media (max-width: 400px) {
            .scores-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><i class="fas fa-music"></i> Music Library</h1>
        <div class="header-actions">
            <a href="dashboard.html" class="btn-outline"><i class="fas fa-arrow-left"></i> Dashboard</a>
        </div>
    </div>

    <div class="hero">
        <div class="hero-icon">🎼</div>
        <div class="hero-text">
            <h2>Sheet Music for Practice</h2>
            <p>Download scores to practice at home — new pieces added regularly</p>
        </div>
    </div>

    <div class="toolbar">
        <div class="search-wrap">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="Search by title, composer, or tag…">
        </div>
        <select id="voiceFilter" class="filter-select">
            <option value="all">All voice parts</option>
            <option value="All">All voices</option>
            <option value="Soprano">Soprano</option>
            <option value="Alto">Alto</option>
            <option value="Tenor">Tenor</option>
            <option value="Bass">Bass</option>
            <option value="Director">Director</option>
            <option value="Brass">Brass</option>
        </select>
        <select id="categoryFilter" class="filter-select">
            <option value="all">All categories</option>
            <option value="Warm-up">Warm-up</option>
            <option value="Rehearsal">Rehearsal</option>
            <option value="Performance">Performance</option>
            <option value="Festival">Festival</option>
            <option value="Worship">Worship</option>
            <option value="Other">Other</option>
        </select>
    </div>

    <div class="stats-bar">
        <div class="stat-item"><i class="fas fa-file-pdf"></i> <strong id="statTotal">0</strong> scores</div>
        <div class="stat-item"><i class="fas fa-download"></i> <strong id="statDownloads">0</strong> downloads</div>
        <div class="stat-item"><i class="fas fa-star"></i> <strong id="statNew">0</strong> new this week</div>
    </div>

    <div class="sort-tabs">
        <button class="sort-tab active" data-sort="recent" onclick="setSort('recent', this)"><i class="fas fa-clock"></i> Recent</button>
        <button class="sort-tab" data-sort="popular" onclick="setSort('popular', this)"><i class="fas fa-fire"></i> Most Downloaded</button>
        <button class="sort-tab" data-sort="az" onclick="setSort('az', this)"><i class="fas fa-sort-alpha-down"></i> A–Z</button>
    </div>

    <div class="scores-grid" id="scoresGrid">
        <div class="empty-state"><i class="fas fa-spinner fa-spin"></i><h3>Loading music library…</h3></div>
    </div>
</div>

<nav class="bottom-nav">
    <a href="dashboard.html" class="bottom-nav-item"><i class="fas fa-chart-pie"></i><span>Stats</span></a>
    <a href="dashboard.html" class="bottom-nav-item"><i class="fas fa-user"></i><span>Profile</span></a>
    <a href="music-library.html" class="bottom-nav-item active"><i class="fas fa-music"></i><span>Music</span></a>
    <a href="dashboard.html" class="bottom-nav-item"><i class="fas fa-wallet"></i><span>Finance</span></a>
</nav>

<div class="toast" id="toast"></div>

<script>
    const SUPABASE_URL = 'https://skrvassehezrynudbahn.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrcnZhc3NlaGV6cnludWRiYWhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MzUyMzAsImV4cCI6MjA5MjExMTIzMH0.iA93tmu9TCdmEhUxBLGRUE0fRdDha9-WPps8qNzd5a0';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allScores = [];
    let currentSort = 'recent';
    let currentMemberId = null;

    function esc(s) { if (!s) return ''; return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
    function fmtDate(iso) {
        if (!iso) return '—';
        const d = new Date(iso);
        const diff = Date.now() - d.getTime();
        const days = Math.floor(diff / 86400000);
        if (days < 1) return 'Today';
        if (days === 1) return 'Yesterday';
        if (days < 7) return days + ' days ago';
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }
    function isNew(iso) { return iso && (Date.now() - new Date(iso).getTime()) < 7 * 86400000; }

    let toastTimer;
    function showToast(msg, type = 'info') {
        const t = document.getElementById('toast');
        clearTimeout(toastTimer);
        const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
        t.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i> ${msg}`;
        t.className = `toast show ${type}`;
        toastTimer = setTimeout(() => { t.className = 'toast'; }, 3000);
    }

    async function getCurrentMember() {
        try {
            const { data: { user } } = await sb.auth.getUser();
            if (!user) { window.location.href = '../login.html'; return null; }
            const { data: um } = await sb.from('user_members').select('member_id').eq('user_id', user.id).single();
            currentMemberId = um?.member_id || null;
            return user;
        } catch { return null; }
    }

    async function loadScores() {
        const grid = document.getElementById('scoresGrid');
        grid.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i><h3>Loading music library…</h3></div>';

        const { data, error } = await sb
            .from('music_scores')
            .select('*')
            .eq('is_published', true)
            .order('uploaded_at', { ascending: false });

        if (error) {
            grid.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>Error loading scores</h3><p>${esc(error.message)}</p></div>`;
            return;
        }
        allScores = data || [];
        updateStats();
        renderScores();
    }

    function updateStats() {
        document.getElementById('statTotal').textContent = allScores.length;
        document.getElementById('statDownloads').textContent = allScores.reduce((s, x) => s + (x.download_count || 0), 0);
        document.getElementById('statNew').textContent = allScores.filter(x => isNew(x.uploaded_at)).length;
    }

    function setSort(sort, btn) {
        currentSort = sort;
        document.querySelectorAll('.sort-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderScores();
    }

    function getFilteredAndSorted() {
        const q = document.getElementById('searchInput').value.toLowerCase().trim();
        const voice = document.getElementById('voiceFilter').value;
        const category = document.getElementById('categoryFilter').value;

        let list = [...allScores];
        if (q) {
            list = list.filter(s =>
                (s.title || '').toLowerCase().includes(q) ||
                (s.composer || '').toLowerCase().includes(q) ||
                (s.tags || []).some(t => t.toLowerCase().includes(q))
            );
        }
        if (voice !== 'all') list = list.filter(s => s.voice_part === voice);
        if (category !== 'all') list = list.filter(s => s.category === category);

        if (currentSort === 'popular') list.sort((a, b) => (b.download_count || 0) - (a.download_count || 0));
        else if (currentSort === 'az') list.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
        else list.sort((a, b) => new Date(b.uploaded_at) - new Date(a.uploaded_at));

        return list;
    }

    function renderScores() {
        const grid = document.getElementById('scoresGrid');
        const list = getFilteredAndSorted();

        if (!list.length) {
            grid.innerHTML = `<div class="empty-state"><i class="fas fa-music"></i><h3>No scores found</h3><p>Try a different search or filter</p></div>`;
            return;
        }

        grid.innerHTML = list.map(s => {
            const thumb = s.preview_url
                ? `<img src="${s.preview_url}" alt="${esc(s.title)}" loading="lazy" onerror="this.onerror=null; this.parentElement.innerHTML='<i class=\\'fas fa-file-pdf placeholder\\'></i>';">`
                : `<i class="fas fa-file-pdf placeholder"></i>`;
            const newBadge = isNew(s.uploaded_at) ? '<span class="new-badge">🆕 NEW</span>' : '';
            const tags = (s.tags || []).slice(0, 2).map(t => `<span class="chip chip-gray">${esc(t)}</span>`).join('');

            return `
                <div class="score-card">
                    <div class="score-thumb">
                        ${newBadge}
                        <span class="pdf-badge"><i class="fas fa-file-pdf"></i> PDF</span>
                        ${thumb}
                    </div>
                    <div class="score-body">
                        <div class="score-title">${esc(s.title)}</div>
                        <div class="score-composer"><i class="fas fa-user"></i> ${esc(s.composer || 'Unknown')}</div>
                        <div class="score-chips">
                            <span class="chip chip-primary"><i class="fas fa-microphone"></i> ${esc(s.voice_part || 'All')}</span>
                            <span class="chip chip-amber"><i class="fas fa-tag"></i> ${esc(s.category || '—')}</span>
                            ${tags}
                        </div>
                        <div class="score-meta">
                            <span><i class="fas fa-download"></i> ${s.download_count || 0}</span>
                            <span><i class="fas fa-clock"></i> ${fmtDate(s.uploaded_at)}</span>
                        </div>
                    </div>
                    <div class="score-actions">
                        <button class="download-btn" onclick="downloadScore('${s.id}')">
                            <i class="fas fa-download"></i> Download
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }

    async function downloadScore(id) {
        const s = allScores.find(x => x.id === id);
        if (!s || !s.file_url) { showToast('File not available', 'error'); return; }

        // Track download
        try {
            await sb.from('score_downloads').insert({ score_id: id, member_id: currentMemberId });
            await sb.rpc('increment_score_download', { score_id_input: id });
            s.download_count = (s.download_count || 0) + 1;
            updateStats();
        } catch (e) { console.warn('Download tracking failed:', e); }

        // Force download via Cloudinary attachment flag
        const downloadUrl = s.file_url.includes('/upload/')
            ? s.file_url.replace('/upload/', '/upload/fl_attachment/')
            : s.file_url;

        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = `${s.title}.pdf`;
        a.target = '_blank';
        a.rel = 'noopener';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        showToast(`⬇️ Downloading "${s.title}"…`, 'success');
    }

    document.getElementById('searchInput').addEventListener('input', renderScores);
    document.getElementById('voiceFilter').addEventListener('change', renderScores);
    document.getElementById('categoryFilter').addEventListener('change', renderScores);

    async function init() {
        const { data: { session } } = await sb.auth.getSession();
        if (!session) { window.location.href = '../login.html'; return; }
        await getCurrentMember();
        await loadScores();
    }
    init();

    window.setSort = setSort;
    window.downloadScore = downloadScore;
</script>
</body>
</html>

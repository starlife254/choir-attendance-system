<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | University of Embu Choir</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/cache-helper.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 28px;
            padding: 35px 30px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35);
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .icon { font-size: 55px; text-align: center; margin-bottom: 16px; }
        h1 { font-size: 22px; color: #1e293b; text-align: center; margin-bottom: 8px; }
        .sub { font-size: 14px; color: #64748b; text-align: center; margin-bottom: 24px; line-height: 1.5; }
        .info-box {
            background: #fef3c7;
            border: 1px solid #fcd34d;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 22px;
            font-size: 13px;
            color: #92400e;
            line-height: 1.5;
        }
        .info-box strong { display: block; margin-bottom: 4px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #334155; font-size: 13px; }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
            margin-bottom: 16px;
            outline: none;
        }
        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
        }
        .password-hint {
            font-size: 11.5px;
            color: #94a3b8;
            margin-top: -12px;
            margin-bottom: 16px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
        }
        button:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(102,126,234,0.35); }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .msg {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 18px;
            display: none;
            font-size: 14px;
            line-height: 1.5;
        }
        .msg.error { background: #fee2e2; color: #991b1b; display: block; }
        .msg.success { background: #d1fae5; color: #065f46; display: block; }
        .msg.info { background: #e0f2fe; color: #0369a1; display: block; }
        .strength-bar {
            height: 4px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
            margin: -10px 0 16px;
        }
        .strength-fill {
            height: 100%;
            width: 0%;
            transition: width 0.2s, background 0.2s;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🔐</div>
        <h1>Set a New Password</h1>
        <p class="sub">Your password was reset by the choir admin.<br>Please create a new personal password to continue.</p>

        <div class="info-box">
            <strong>⚠️ Temporary password detected</strong>
            You must set a new password before accessing the choir system.
        </div>

        <div class="msg" id="msg"></div>

        <form id="changeForm">
            <label>New Password</label>
            <input type="password" id="newPassword" placeholder="Minimum 8 characters" autocomplete="new-password" required>
            <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>

            <label>Confirm New Password</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter your new password" autocomplete="new-password" required>
            <p class="password-hint">Use at least 8 characters with a mix of letters and numbers.</p>

            <button type="submit" id="submitBtn">Set New Password</button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://skrvassehezrynudbahn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrcnZhc3NlaGV6cnludWRiYWhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MzUyMzAsImV4cCI6MjA5MjExMTIzMH0.iA93tmu9TCdmEhUxBLGRUE0fRdDha9-WPps8qNzd5a0';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const msg = document.getElementById('msg');
        const newPwdInput = document.getElementById('newPassword');
        const confirmInput = document.getElementById('confirmPassword');
        const strengthFill = document.getElementById('strengthFill');
        const btn = document.getElementById('submitBtn');

        function show(text, cls = 'error') {
            msg.innerHTML = text;
            msg.className = 'msg ' + cls;
            msg.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // Password strength indicator
        newPwdInput.addEventListener('input', () => {
            const pwd = newPwdInput.value;
            let score = 0;
            if (pwd.length >= 8) score++;
            if (pwd.length >= 12) score++;
            if (/[a-z]/.test(pwd) && /[A-Z]/.test(pwd)) score++;
            if (/\d/.test(pwd)) score++;
            if (/[^A-Za-z0-9]/.test(pwd)) score++;

            const pct = (score / 5) * 100;
            strengthFill.style.width = pct + '%';

            if (score <= 2) strengthFill.style.background = '#ef4444';
            else if (score <= 3) strengthFill.style.background = '#f59e0b';
            else if (score <= 4) strengthFill.style.background = '#10b981';
            else strengthFill.style.background = '#059669';
        });

        // Verify session on load
        async function checkSession() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) {
                window.location.href = '../login.html';
                return null;
            }

            // Verify the user actually needs a password change
            const { data: profile } = await sb
                .from('user_profiles')
                .select('must_change_password')
                .eq('user_id', session.user.id)
                .maybeSingle();

            console.log('Profile on load:', profile);

            if (!profile || !profile.must_change_password) {
                // No need to change — send to dashboard
                console.log('No password change needed — redirecting to dashboard');
                window.location.href = 'dashboard.html';
                return null;
            }

            return session;
        }

        document.getElementById('changeForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const newPassword = newPwdInput.value;
            const confirmPassword = confirmInput.value;

            if (newPassword !== confirmPassword) {
                show('Passwords do not match!');
                return;
            }

            if (newPassword.length < 8) {
                show('Password must be at least 8 characters.');
                return;
            }

            if (newPassword === 'UOEMCHOIR') {
                show('You cannot use the temporary password as your new password.');
                return;
            }

            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Updating…';

            try {
                // ── Step 1: Get current user ──
                const { data: userData, error: userError } = await sb.auth.getUser();
                if (userError || !userData?.user) {
                    throw new Error('Could not verify your session. Please log in again.');
                }
                const userId = userData.user.id;
                console.log('Updating password for user:', userId);

                // ── Step 2: Update password via Supabase Auth ──
                show('Updating your password…', 'info');
                const { error: pwdError } = await sb.auth.updateUser({
                    password: newPassword
                });

                if (pwdError) throw pwdError;
                console.log('✅ Password updated in auth');

                // ── Step 3: Clear the must_change_password flag ──
                show('Clearing password reset flag…', 'info');
                const { data: updateResult, error: profileError } = await sb
                    .from('user_profiles')
                    .update({
                        must_change_password: false,
                        temp_password_set_at: null
                    })
                    .eq('user_id', userId)
                    .select();

                if (profileError) {
                    console.error('Profile update error:', profileError);
                    throw new Error('Password changed, but could not clear the reset flag. Please contact admin.');
                }

                console.log('✅ Profile flag cleared:', updateResult);

                // ── Step 4: Verify flag was actually cleared ──
                const { data: verify } = await sb
                    .from('user_profiles')
                    .select('must_change_password')
                    .eq('user_id', userId)
                    .maybeSingle();

                if (verify?.must_change_password === true) {
                    console.error('❌ Flag still true after update');
                    throw new Error('Could not clear the reset flag. Please contact admin.');
                }

                console.log('✅ Verified: must_change_password is false');

                // ── Success! ──
                show('✅ Password updated successfully! Redirecting to dashboard…', 'success');

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);

            } catch (err) {
                console.error('Change password error:', err);
                show('❌ ' + err.message);
                btn.disabled = false;
                btn.textContent = originalText;
            }
        });

        // Initialize
        (async () => {
            const session = await checkSession();
            if (!session) return;
        })();
    </script>
</body>
</html>
